<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>

    <h1>HTML Input Types</h1>

    <form>

        <!-- Text -->
        <label>Text:</label>
        <input type="text" name="username">
        <br><br>

        <!-- Password -->
        <label>Password:</label>
        <input type="password" name="password">
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <!-- Number -->
        <label>Number:</label>
        <input type="number" name="number">
        <br><br>

        <!-- Telephone -->
        <label>Phone:</label>
        <input type="tel" name="phone">
        <br><br>

        <!-- URL -->
        <label>Website:</label>
        <input type="url" name="website">
        <br><br>

        <!-- Search -->
        <label>Search:</label>
        <input type="search" name="search">
        <br><br>

        <!-- Date -->
        <label>Date:</label>
        <input type="date" name="date">
        <br><br>

        <!-- Time -->
        <label>Time:</label>
        <input type="time" name="time">
        <br><br>

        <!-- Date and Time -->
        <label>Date & Time:</label>
        <input type="datetime-local" name="datetime">
        <br><br>

        <!-- Month -->
        <label>Month:</label>
        <input type="month" name="month">
        <br><br>

        <!-- Week -->
        <label>Week:</label>
        <input type="week" name="week">
        <br><br>

        <!-- Radio -->
        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <!-- Checkbox -->
        <label>Skills:</label>
        <input type="checkbox" name="html"> HTML
        <input type="checkbox" name="css"> CSS
        <input type="checkbox" name="js"> JavaScript
        <br><br>

        <!-- Color -->
        <label>Color:</label>
        <input type="color" name="color">
        <br><br>

        <!-- Range -->
        <label>Range:</label>
        <input type="range" name="range" min="0" max="100">
        <br><br>

        <!-- File -->
        <label>Upload File:</label>
        <input type="file" name="file">
        <br><br>

        <!-- Hidden -->
        <input type="hidden" name="id" value="123">

        <!-- Image -->
        <label>Image Button:</label>
        <input type="image"
               src="https://via.placeholder.com/100x40"
               alt="Submit"
               width="100">
        <br><br>

        <!-- Submit -->
        <input type="submit" value="Submit">

        <!-- Reset -->
        <input type="reset" value="Reset">

        <!-- Button -->
        <input type="button" value="Click Me">

    </form>

</body>
</html>
